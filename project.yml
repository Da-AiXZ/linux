name: LinuxProbe

options:
  bundleIdPrefix: com.daixz.linux
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "0.38.4"
    CURRENT_PROJECT_VERSION: "79"
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_MODULES: YES
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  Probe:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daixz.linux.probe
        PRODUCT_NAME: Probe
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Probe.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: LiveProcess
        embed: true

  LiveProcess:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveProcess
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daixz.linux.probe.LiveProcess
        PRODUCT_NAME: LiveProcess
        INFOPLIST_FILE: LiveProcess/Info.plist
        CODE_SIGN_ENTITLEMENTS: LiveProcess/LiveProcess.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_ENTRY_POINT: _NSExtensionMain
        OTHER_LDFLAGS: "-Wl,-e,_NSExtensionMain"
        TARGETED_DEVICE_FAMILY: "1,2"

  ProbeHelper:
    type: tool
    platform: iOS
    sources:
      - path: Helper
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: probe-helper
        PRODUCT_BUNDLE_IDENTIFIER: com.daixz.linux.probe.helper
        MACH_O_TYPE: mh_execute
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: "-framework Foundation -framework CoreFoundation"
        TARGETED_DEVICE_FAMILY: "1,2"

  GuestRunner:
    type: tool
    platform: iOS
    sources:
      - path: Guest
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: guest-runner
        PRODUCT_BUNDLE_IDENTIFIER: com.daixz.linux.probe.guest
        MACH_O_TYPE: mh_execute
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: "-framework Foundation -framework CoreFoundation"
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  Probe:
    build:
      targets:
        Probe: all
        ProbeHelper: all
        GuestRunner: all
    run:
      config: Debug
    archive:
      config: Release
