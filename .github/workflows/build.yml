name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project LinuxProbe.xcodeproj \
            -scheme Probe \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -eux
          APP="build/Build/Products/Release-iphoneos/Probe.app"
          test -d "$APP"
          rm -rf Payload LinuxProbe.ipa
          mkdir Payload
          ditto "$APP" "Payload/Probe.app"

          # Best-effort ad-hoc signing with the probe entitlements.
          # TrollStore re-signs on install; keeping the entitlements embedded
          # makes the probe meaningful when it is installed through TrollStore.
          codesign --force --sign - --entitlements App/Probe.entitlements \
            "Payload/Probe.app/Probe" || true
          codesign --force --sign - --entitlements LiveProcess/LiveProcess.entitlements \
            "Payload/Probe.app/PlugIns/LiveProcess.appex/LiveProcess" || true
          codesign --force --sign - \
            "Payload/Probe.app/PlugIns/LiveProcess.appex" || true
          codesign --force --sign - \
            "Payload/Probe.app" || true

          /usr/bin/zip -r -y LinuxProbe.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LinuxProbe-ipa
          path: LinuxProbe.ipa
          if-no-files-found: error
