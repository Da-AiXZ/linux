name: build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install signing tool
        run: brew install ldid || true

      - name: Fetch Alpine runtime
        run: |
          set -eux
          curl -fsSL -o /tmp/alpine-minirootfs.tar.gz \
            https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.3-aarch64.tar.gz
          mkdir -p /tmp/alpine-rootfs
          tar -xzf /tmp/alpine-minirootfs.tar.gz -C /tmp/alpine-rootfs

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project LinuxProbe.xcodeproj \
            -scheme Probe \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # zlib isolation experiment: rebuild zlib with MY_ZCALLOC so every zlib
      # allocation gets its own mapping with a trailing guard page.  Soft-fail:
      # if zig or the source is unavailable we keep Alpine's libz.
      - name: Build guarded libz (experiment)
        continue-on-error: true
        run: |
          set -u
          brew install zig >/dev/null 2>&1 || true
          if ! command -v zig >/dev/null 2>&1; then
            echo "zig unavailable, keeping Alpine libz"
            exit 0
          fi
          curl -fsSL -o /tmp/zlib.tar.gz \
            https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          rm -rf /tmp/zlib
          mkdir -p /tmp/zlib
          tar -xzf /tmp/zlib.tar.gz -C /tmp/zlib --strip-components=1
          cp Tools/zguard.c /tmp/zlib/zguard.c
          ( cd /tmp/zlib && zig cc -target aarch64-linux-musl -O2 -fPIC -shared \
              -DMY_ZCALLOC -D_LARGEFILE64_SOURCE=1 \
              -Wl,-soname,libz.so.1 -o /tmp/libz-guard.so.1 *.c ) \
            || { echo "guarded zlib build failed"; exit 0; }
          file /tmp/libz-guard.so.1
          ls -l /tmp/libz-guard.so.1

      # zspy: same zlib, default allocator, but -DZ_PREFIX turns the entry
      # points into z_inflate/z_inflateInit2_ and Tools/zspy.c re-exports the
      # normal names, logging the exact input prefix zlib consumed.  This is
      # the instrument that separates "input buffer damaged" from
      # "inflate_state damaged", now that the cached data is known to be
      # byte-identical to the CDN.
      - name: Build instrumented libz (zspy)
        continue-on-error: true
        run: |
          set -u
          brew install zig >/dev/null 2>&1 || true
          if ! command -v zig >/dev/null 2>&1; then
            echo "zig unavailable, keeping Alpine libz"
            exit 0
          fi
          curl -fsSL -o /tmp/zlib2.tar.gz \
            https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          rm -rf /tmp/zlib2
          mkdir -p /tmp/zlib2
          tar -xzf /tmp/zlib2.tar.gz -C /tmp/zlib2 --strip-components=1
          python3 Tools/patch_inffast.py /tmp/zlib2/inffast.c
          grep -c "\[zf\]" /tmp/zlib2/inffast.c
          python3 Tools/patch_inflate.py /tmp/zlib2/inflate.c
          grep -c "\[zl\]" /tmp/zlib2/inflate.c
          python3 Tools/patch_inffast_len.py /tmp/zlib2/inffast.c
          grep -c "\[zf3\]" /tmp/zlib2/inffast.c
          mkdir -p /tmp/zspy
          for f in /tmp/zlib2/*.c; do
            zig cc -target aarch64-linux-musl -O2 -fPIC -DZ_PREFIX \
              -D_LARGEFILE64_SOURCE=1 -c "$f" -o "/tmp/zspy/$(basename "$f" .c).o" \
              || { echo "zlib prefix build failed"; exit 0; }
          done
          cp Tools/zspy.c /tmp/zspy/zspy.c
          zig cc -target aarch64-linux-musl -O2 -fPIC -c /tmp/zspy/zspy.c \
            -o /tmp/zspy/zspy.o || { echo "zspy build failed"; exit 0; }
          ( cd /tmp/zspy && zig cc -target aarch64-linux-musl -shared \
              -Wl,-soname,libz.so.1 -o /tmp/libz-spy.so.1 *.o ) \
            || { echo "zspy link failed"; exit 0; }
          file /tmp/libz-spy.so.1
          ls -l /tmp/libz-spy.so.1
          # A missing export is invisible until the device tries to relocate
          # libapk, and that costs an install to find out.  Fail here and fall
          # back to Alpine's libz instead of shipping a library that cannot
          # resolve deflate/uncompress.
          python3 Tools/check_exports.py /tmp/libz-spy.so.1 \
            inflate inflateInit_ inflateInit2_ inflateEnd inflateReset \
            inflateSync inflateCopy \
            deflate deflateInit_ deflateInit2_ deflateEnd deflateReset \
            deflateParams deflateBound \
            compress compress2 compressBound uncompress uncompress2 \
            crc32 crc32_z adler32 adler32_z zlibVersion zlibCompileFlags \
            zError get_crc_table \
            || { echo "zspy is missing exports, keeping Alpine libz"; rm -f /tmp/libz-spy.so.1; }

      # The device crashes inside libz at a fixed offset on the second gzip
      # member ("pc in 0x...+0x21d5c", far=0x18).  Print the code and the source
      # line there so the faulting statement is known without guessing.
      # The device crashes inside libz at a fixed offset on the second gzip
      # member ("pc in 0x...+0x21d5c", far=0x18).  Dump the words and the
      # bracketing symbols there; the runner has no llvm-objdump on PATH.
      - name: Inspect the crash site
        continue-on-error: true
        run: |
          set -u
          SO=/tmp/libz-spy.so.1
          test -f "$SO" || { echo "no instrumented libz"; exit 0; }
          echo "--- patch sites in the instrumented libz ---"
          python3 Tools/verify_patch_sites.py "$SO" 2>&1 | tail -3 || true
          echo "--- patch sites in Alpine's libz ---"
          python3 Tools/verify_patch_sites.py \
            /tmp/alpine-rootfs/lib/libz.so.1.3.1 2>&1 | tail -3 || true
          python3 Tools/elf_peek.py "$SO" loads || true
          echo "--- runtime offset 0x21d5c ---"
          python3 Tools/elf_peek.py "$SO" 0x21d5c 0x20 0x40 || true
          echo "--- runtime offset 0x21d5c minus 0x10000 ---"
          python3 Tools/elf_peek.py "$SO" 0x11d5c 0x20 0x40 || true

      - name: Package IPA
        run: |
          set -eux
          APP="build/Build/Products/Release-iphoneos/Probe.app"
          HELPER="build/Build/Products/Release-iphoneos/probe-helper"
          GUEST="build/Build/Products/Release-iphoneos/guest-runner"
          test -d "$APP"
          test -f "$HELPER"
          test -f "$GUEST"
          mkdir -p "$APP/Helpers"
          cp "$HELPER" "$APP/Helpers/probe-helper"
          cp "$HELPER" "$APP/Helpers/probe-helper.dat"
          cp "$GUEST" "$APP/Helpers/guest-runner"
          cp Tools/busybox.static "$APP/Helpers/busybox"
          cp Tools/pie-hello "$APP/Helpers/pie-hello"
          mkdir -p "$APP/Helpers/alpine/lib"
          cp /tmp/alpine-rootfs/lib/ld-musl-aarch64.so.1 \
             "$APP/Helpers/alpine/lib/ld-musl-aarch64.so.1"
          cp /tmp/alpine-rootfs/lib/ld-musl-aarch64.so.1 \
             "$APP/Helpers/alpine/lib/libc.musl-aarch64.so.1"
          cp /tmp/alpine-rootfs/lib/libapk.so.2.14.0 \
             "$APP/Helpers/alpine/lib/libapk.so.2.14.0"
          cp /tmp/alpine-rootfs/lib/libcrypto.so.3 \
             "$APP/Helpers/alpine/lib/libcrypto.so.3"
          cp /tmp/alpine-rootfs/lib/libssl.so.3 \
             "$APP/Helpers/alpine/lib/libssl.so.3"
          # 0.39.2 A/B proved the inflate data errors are not zlib-version
          # specific (1.2.13 from v3.18 failed the same way), so go back to the
          # minirootfs build that apk was compiled against.
          # The guarded zlib is kept as an experiment: it turns the stray heap
          # write into a hard fault during index parsing instead of a silent
          # EIO, but it does not catch the writer (the write is intra-page), so
          # it is off by default.  Set USE_GUARDED_ZLIB=1 to enable it.
          if [ -f /tmp/libz-spy.so.1 ] && [ "${USE_ZSPY_ZLIB:-1}" = "1" ]; then
            cp /tmp/libz-spy.so.1 "$APP/Helpers/alpine/lib/libz.so.1"
            echo "instrumented libz in use"
          elif [ -f /tmp/libz-guard.so.1 ] && [ "${USE_GUARDED_ZLIB:-0}" = "1" ]; then
            cp /tmp/libz-guard.so.1 "$APP/Helpers/alpine/lib/libz.so.1"
            echo "guarded libz in use"
          else
            cp /tmp/alpine-rootfs/lib/libz.so.1.3.1 \
               "$APP/Helpers/alpine/lib/libz.so.1"
          fi
          # A zig-built libz records NEEDED libc.so; musl ships it as the linker
          # script name, so provide the same binary under both names.
          cp /tmp/alpine-rootfs/lib/ld-musl-aarch64.so.1 \
             "$APP/Helpers/alpine/lib/libc.so"
          shasum -a 256 "$APP/Helpers/alpine/lib/libz.so.1"
          # Repository signing keys and CA roots (both ship in the minirootfs)
          # so `apk update` can verify indexes over https.
          mkdir -p "$APP/Helpers/alpine/etc/apk/keys" \
                   "$APP/Helpers/alpine/etc/ssl/certs"
          cp /tmp/alpine-rootfs/etc/apk/keys/*.rsa.pub \
             "$APP/Helpers/alpine/etc/apk/keys/"
          cp /tmp/alpine-rootfs/etc/ssl/certs/ca-certificates.crt \
             "$APP/Helpers/alpine/etc/ssl/certs/ca-certificates.crt"
          # OpenSSL's default trust file is <openssldir>/cert.pem.
          cp /tmp/alpine-rootfs/etc/ssl/cert.pem \
             "$APP/Helpers/alpine/etc/ssl/cert.pem"
          cp /tmp/alpine-rootfs/sbin/apk "$APP/Helpers/alpine-apk"
          cp /tmp/alpine-rootfs/bin/busybox "$APP/Helpers/alpine-busybox"

          # Build a tiny unsigned Alpine package for `apk add` testing.  The
          # payload is one of our own minimal aarch64 ELF programs (without
          # the deliberate fault probe).
          python3 tools/make_guest_elf.py /tmp/hello.elf --no-fault
          python3 tools/make_hello_apk.py /tmp/hello.elf \
            "$APP/Helpers/hello.apk"

          chmod 755 "$APP/Helpers/probe-helper"
          chmod 644 "$APP/Helpers/probe-helper.dat"
          chmod 755 "$APP/Helpers/guest-runner"
          chmod 755 "$APP/Helpers/busybox"
          chmod 755 "$APP/Helpers/pie-hello"
          chmod 755 "$APP/Helpers/alpine-apk" "$APP/Helpers/alpine-busybox"
          python3 tools/make_guest_elf.py "$APP/guest-hello.elf"
          python3 tools/make_fork_elf.py "$APP/fork-test.elf"
          rm -rf Payload PayloadUnsigned LinuxProbe.ipa LinuxProbe-unsigned.ipa
          mkdir Payload
          mkdir -p PayloadUnsigned/Payload
          ditto "$APP" "Payload/Probe.app"
          ditto "$APP" "PayloadUnsigned/Payload/Probe.app"

          # Unsigned variant: let TrollStore perform the complete signature
          # pass if the pre-signed appex is rejected by PlugInKit.
          (cd PayloadUnsigned && /usr/bin/zip -r -y ../LinuxProbe-unsigned.ipa Payload)

          # Best-effort signing with the probe entitlements. TrollStore
          # re-signs on install; keeping the entitlements embedded makes the
          # probe meaningful when it is installed through TrollStore.
          if command -v ldid >/dev/null 2>&1; then
            ldid -SApp/Probe.entitlements "Payload/Probe.app/Probe" \
              || codesign --force --sign - --entitlements App/Probe.entitlements \
                   "Payload/Probe.app/Probe" || true
            ldid -SLiveProcess/LiveProcess.entitlements \
              "Payload/Probe.app/PlugIns/LiveProcess.appex/LiveProcess" \
              || codesign --force --sign - \
                   --entitlements LiveProcess/LiveProcess.entitlements \
                   "Payload/Probe.app/PlugIns/LiveProcess.appex/LiveProcess" || true
            ldid -SHelper/ProbeHelper.entitlements \
              "Payload/Probe.app/Helpers/probe-helper" \
              || codesign --force --sign - \
                   --entitlements Helper/ProbeHelper.entitlements \
                   "Payload/Probe.app/Helpers/probe-helper" || true
            ldid -SHelper/ProbeHelper.entitlements \
              "Payload/Probe.app/Helpers/probe-helper.dat" \
              || codesign --force --sign - \
                   --entitlements Helper/ProbeHelper.entitlements \
                   "Payload/Probe.app/Helpers/probe-helper.dat" || true
            ldid -SGuest/GuestRunner.entitlements \
              "Payload/Probe.app/Helpers/guest-runner" \
              || codesign --force --sign - \
                   --entitlements Guest/GuestRunner.entitlements \
                   "Payload/Probe.app/Helpers/guest-runner" || true
          else
            codesign --force --sign - --entitlements App/Probe.entitlements \
              "Payload/Probe.app/Probe" || true
            codesign --force --sign - \
              --entitlements LiveProcess/LiveProcess.entitlements \
              "Payload/Probe.app/PlugIns/LiveProcess.appex/LiveProcess" || true
            codesign --force --sign - \
              --entitlements Helper/ProbeHelper.entitlements \
              "Payload/Probe.app/Helpers/probe-helper" || true
            codesign --force --sign - \
              --entitlements Helper/ProbeHelper.entitlements \
              "Payload/Probe.app/Helpers/probe-helper.dat" || true
            codesign --force --sign - \
              --entitlements Guest/GuestRunner.entitlements \
              "Payload/Probe.app/Helpers/guest-runner" || true
          fi
          codesign --force --sign - \
            --entitlements LiveProcess/LiveProcess.entitlements \
            "Payload/Probe.app/PlugIns/LiveProcess.appex" || true
          codesign --force --sign - \
            --entitlements App/Probe.entitlements \
            "Payload/Probe.app" || true

          /usr/bin/zip -r -y LinuxProbe.ipa Payload

      # Cross-check the runtime's patch count against the actual instruction
      # stream.  GuestPatchCodeRange scans 4-byte words for three encodings, so
      # a literal pool word that happens to equal `svc #0' would be rewritten
      # too.  On device the loader reports patched=478 tls_mrs=90 tls_msr=1 for
      # this exact binary; if the static counts differ, a false positive exists
      # and the "code silently patched" hypothesis is back on the table.
      - name: Verify patch sites against the static scan
        run: |
          set -u
          APP="build/Build/Products/Release-iphoneos/Probe.app"
          # The 478/90/1 that `loaded ... patched=478 tls_mrs=90 tls_msr=1'
          # reports belong to the dynamic linker, not to apk: apk is a dynamic
          # musl program and issues no svc itself (its own count is 0).
          INTERP="$APP/Helpers/alpine/lib/ld-musl-aarch64.so.1"
          APKBIN="$APP/Helpers/alpine-apk"
          test -f "$INTERP"
          test -f "$APKBIN"
          python3 Tools/verify_patch_sites.py "$INTERP" --expect=478,90,1 \
            || echo "::warning::interp patch-site count differs from the device log"
          python3 Tools/verify_patch_sites.py "$APKBIN" --expect=0,0,0 \
            || echo "::warning::apk unexpectedly contains patch sites"

      - name: Upload IPAs
        uses: actions/upload-artifact@v4
        with:
          name: LinuxProbe-ipas
          path: LinuxProbe*.ipa
          if-no-files-found: error
