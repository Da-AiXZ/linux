name: runtime

# Reproduce the guest runtime without a device.  The iOS simulator runs on
# the same Apple Silicon CPU, uses 16 KB pages, and permits the RWX mapping
# that the loader needs when 4 KB guest segments share a 16 KB host page.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  simulator-apk:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build simulator guest runner
        run: |
          set -eux
          xcrun --sdk iphonesimulator clang \
            -target arm64-apple-ios16.0-simulator -fobjc-arc -O1 \
            -Wno-deprecated-declarations \
            -framework Foundation -framework CoreFoundation \
            -o "$RUNNER_TEMP/guest-runner-sim" Guest/GuestRunner.m
          file "$RUNNER_TEMP/guest-runner-sim"

      - name: Prepare Alpine rootfs
        run: |
          set -eux
          curl -fsSL -o "$RUNNER_TEMP/alpine.tar.gz" \
            https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.3-aarch64.tar.gz
          ROOT="$RUNNER_TEMP/rootfs"
          mkdir -p "$ROOT"
          tar -xzf "$RUNNER_TEMP/alpine.tar.gz" -C "$ROOT"
          ls -l "$ROOT/sbin/apk" "$ROOT/bin/busybox" \
                "$ROOT/lib/ld-musl-aarch64.so.1"

      - name: Boot simulator
        run: |
          set -eux
          UDID=$(xcrun simctl list devices available \
            | grep -m1 'iPhone' \
            | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run apk update
        run: |
          set -o pipefail
          ROOT="$RUNNER_TEMP/rootfs"
          SIMCTL_CHILD_LINUXPROBE_ROOT="$ROOT" \
            xcrun simctl spawn --console "$UDID" \
              "$RUNNER_TEMP/guest-runner-sim" \
              "$ROOT/sbin/apk" apk --no-cache --allow-untrusted update \
            2>&1 | tee "$RUNNER_TEMP/apk-update.log"

      - name: Run apk add bash
        run: |
          set -o pipefail
          ROOT="$RUNNER_TEMP/rootfs"
          SIMCTL_CHILD_LINUXPROBE_ROOT="$ROOT" \
            xcrun simctl spawn --console "$UDID" \
              "$RUNNER_TEMP/guest-runner-sim" \
              "$ROOT/sbin/apk" apk --no-cache --allow-untrusted add bash \
            2>&1 | tee "$RUNNER_TEMP/apk-add.log"

      - name: Run installed bash
        run: |
          set -o pipefail
          ROOT="$RUNNER_TEMP/rootfs"
          test -x "$ROOT/bin/bash"
          SIMCTL_CHILD_LINUXPROBE_ROOT="$ROOT" \
            xcrun simctl spawn --console "$UDID" \
              "$RUNNER_TEMP/guest-runner-sim" \
              "$ROOT/bin/bash" bash -c "echo bash ok; uname -a; id" \
            2>&1 | tee "$RUNNER_TEMP/bash.log"

      - name: Logs
        if: always()
        run: |
          for log in apk-update apk-add bash; do
            echo "===== $log ====="
            tail -120 "$RUNNER_TEMP/$log.log" 2>/dev/null || true
          done
