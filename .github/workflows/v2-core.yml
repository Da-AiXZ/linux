name: v2-core

# The v1 workflow (build.yml) needs eight minutes, Xcode and a device to tell
# you anything.  This one answers "is the address space still correct" in
# seconds, on two platforms, with sanitizers.

on:
  push:
    branches: [ main ]
    paths:
      - 'v2/**'
      - '!v2/docs/**'
      - '.github/workflows/v2-core.yml'
  pull_request:
    paths:
      - 'v2/**'
      - '!v2/docs/**'
  workflow_dispatch:

# Pushing ten commits in ten minutes should leave one run, not ten.  Without
# this, every push keeps its own three runners busy and the tab fills with
# stale red runs that all describe the same commit's ancestor.
concurrency:
  group: v2-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          cc --version
          python3 --version

      - name: Reference model
        working-directory: v2
        run: python3 tools/vspace_model.py --check 60 --ops 300 --pages 2048

      - name: Build and run L1 (trace + random, ASan/UBSan)
        working-directory: v2
        run: make test

      # ARCH-v2 §10: a module that grows past 1200 lines is a module that has
      # started absorbing things that belong somewhere else.  v1's answer was
      # one file with 8659 lines and 144 branches.
      - name: Module size budget
        working-directory: v2
        run: |
          set -eu
          for file in src/*.c include/v2/*.h; do
            lines=$(wc -l < "$file")
            echo "$lines  $file"
            if [ "$lines" -gt 1200 ]; then
              echo "::error file=$file::module exceeds 1200 lines ($lines)"
              exit 1
            fi
          done

  # The guest is aarch64 Linux; the only host that can execute it is aarch64.
  # This job is the whole point of the rewrite: a real ELF runs, through the
  # real syscall path, in ten seconds and without a device.
  guest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host architecture
        run: |
          uname -m
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::guest execution needs an arm64 runner"
            exit 1
          fi

      - name: Build runner
        working-directory: v2
        run: make guest

      - name: Run a Linux ELF natively
        working-directory: v2
        run: |
          set -eu
          ./build/guest-runner --root . tests/guest/hello | tee /tmp/guest.out
          grep -q "hello from guest" /tmp/guest.out
          echo "guest exit status: $?"

      # Darwin's madvise is a hint; Linux's is a promise that the next access
      # reads zeros.  v2's decommit relies on the promise -- the tail of every
      # segment, and therefore every library's .bss, is mapped fresh over pages
      # that held something else a moment ago.  If the promise does not hold,
      # musl's globals are seeded with a neighbour's bytes, which is exactly
      # the shape of "a random symbol is not found".
      - name: Page semantics -- a reused page must read as zero
        working-directory: v2
        run: |
          set +e
          V2_PAGETEST=1 ./build/guest-runner --root . tests/guest/hello 2>&1 \
            | tee /tmp/pagetest.out
          if grep -q "DIRTY\|discarded NOTHING" /tmp/pagetest.out; then
            echo "::error::a released page did not come back zero; .bss cannot be trusted"
            exit 1
          fi
          echo "page semantics ok: reuse and MADV_DONTNEED both return zeros"

      # G3: a real, third-party program.  busybox is static PIE (see
      # v2-busybox.yml) and each applet exercises a different corner of the
      # syscall table: getdents64 for ls, openat+read for cat, uname, stat for
      # ls -l, getuid and /etc/passwd for id, getcwd for pwd.
      - name: Static busybox through the loader
        working-directory: v2
        run: |
          set -eu
          if [ ! -f tests/guest/busybox ]; then
            echo "tests/guest/busybox not present; skipping G3"
            exit 0
          fi
          run() {
            echo "--- busybox $*" >&2
            ./build/guest-runner --root tests/guest/root tests/guest/busybox "$@"
          }
          run ls /          | tee /tmp/g3_ls
          run cat /etc/motd | tee /tmp/g3_cat
          run uname -a      | tee /tmp/g3_uname
          run ls -l /hello.txt | tee /tmp/g3_lsl
          run id            | tee /tmp/g3_id
          run pwd           | tee /tmp/g3_pwd

          grep -q "etc"                 /tmp/g3_ls
          grep -q "hello.txt"           /tmp/g3_ls
          grep -q "v2 guest rootfs"     /tmp/g3_cat
          grep -q "Linux"               /tmp/g3_uname
          grep -q "aarch64"             /tmp/g3_uname
          grep -q "hello.txt"           /tmp/g3_lsl
          grep -q "^-rw"                /tmp/g3_lsl
          grep -q "uid=0"               /tmp/g3_id
          test "$(cat /tmp/g3_pwd)" = "/"
          echo "G3 ok: six applets ran"

      # G4: the program does not contain libc.  PT_INTERP names ld.so, we load
      # that at its own base, AT_BASE points at it, and *it* maps
      # libc.musl-aarch64.so.1 from /lib and relocates both sides.  Static PIE
      # (G3) never exercised any of this.
      - name: Dynamic linking (ld.so + libc)
        id: dynamic
        working-directory: v2
        # V2_VERIFY makes every file mapping compare itself against the file.
        # If a failing run also reports MISMATCH, the bytes we put in memory
        # are wrong; if it does not, ld.so is looking at correct bytes and the
        # fault is above us.  Set once, at step level, so no later shell can
        # quietly run without it.
        env:
          V2_VERIFY: "1"
        run: |
          # GitHub runs steps with `bash -e`; the census has to see failures.
          set +e
          if [ ! -f tests/guest/root/lib/ld-musl-aarch64.so.1 ]; then
            echo "::error::the musl runtime is missing from the test rootfs"
            exit 1
          fi
          hardfail=0
          echo "--- dynamic busybox: echo"
          ./build/guest-runner --root tests/guest/root \
            tests/guest/root/bin/busybox echo dynamic-busybox-ok \
            > /tmp/g4_echo 2>&1
          cat /tmp/g4_echo
          grep -q "dynamic-busybox-ok" /tmp/g4_echo || hardfail=1

          # A census, not a pass/fail: the known failure is "symbol not found"
          # during relocation, and it is layout sensitive rather than a rate
          # (V2_VERIFY on: ~1.1%; off: 5.5% on the desktop, 98.5% on the
          # device).  Collecting the layout of each failure is worth more than
          # a single red X, so this keeps going and summarises.
          echo "--- apk --version, census of up to 2000 runs, mappings verified"
          mismatches=0
          failures=0
          runs=0
          : > /tmp/flake.txt
          for run in $(seq 1 2000); do
            runs=$run
            ./build/guest-runner --root tests/guest/root \
              tests/guest/root/sbin/apk --version > /tmp/g4_apk.log 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
              base=$(sed -n 's/.*\[v2\] space \(0x[0-9a-f]*\)\.\..*/\1/p' \
                     /tmp/g4_apk.log | head -1)
              message=$(grep -m1 -E "Error relocating|FAULT" /tmp/g4_apk.log)
              if grep -q "MISMATCH" /tmp/g4_apk.log; then
                mismatches=$((mismatches + 1))
                message="$message | $(grep -m1 MISMATCH /tmp/g4_apk.log)"
              fi
              # Does every executable image still match its file?
              differ=$(grep -c "differs at" /tmp/g4_apk.log)
              matches=$(grep -c "matches the file" /tmp/g4_apk.log)
              message="$message | images differ=$differ matches=$matches"
              echo "run $run exit=$status base=$base | $message" >> /tmp/flake.txt
              cp /tmp/g4_apk.log "/tmp/flake.$failures.log"
              if [ "$failures" -ge 5 ]; then
                break
              fi
            else
              cp /tmp/g4_apk.log /tmp/g4_pass.log
            fi
          done
          echo "runs=$runs failures=$failures mismatches=$mismatches"
          echo "--- last passing run, for comparison ---"
          grep -E "image .* at 0x" /tmp/g4_pass.log 2>/dev/null | head -6 || true
          cat /tmp/flake.txt || true
          # The invariant this step exists to defend is not "zero flakes" --
          # that is v2-flake.yml's job.  It is "no failing run ever finds the
          # bytes in memory different from the bytes in the file".  A MISMATCH
          # is a bug in us; a clean relocation failure is the open bug above.
          if [ "$hardfail" -ne 0 ]; then
            echo "::error::the dynamic busybox did not print its argument"
            exit 1
          fi
          if [ "$mismatches" -ne 0 ]; then
            echo "::error::$mismatches of $runs runs read wrong bytes out of a file mapping"
            cat /tmp/flake.1.log
            exit 1
          fi
          if [ "$failures" -ne 0 ]; then
            echo "::warning::$failures of $runs runs failed to relocate, 0 mismatches (open bug G4-flake)"
            echo "G4 census: $failures failures in $runs runs, every image matched its file"
          else
            echo "G4 ok: ld.so loaded, libc relocated, apk ran $runs times"
          fi

      # G5 groundwork: apk's index path, against a repo that lives inside the
      # guest root (no network, no signature: --allow-untrusted).  This is the
      # first thing in the project that makes the guest *write* -- cache dirs,
      # temp files, renames -- so it is also the first test of fsops.c.
      - name: apk update against a local repository
        working-directory: v2
        run: |
          set -eu
          rm -rf /tmp/g5root
          cp -R tests/guest/root /tmp/g5root
          ./build/guest-runner --root /tmp/g5root /tmp/g5root/sbin/apk \
            update --allow-untrusted --no-progress 2>&1 | tee /tmp/g5_update
          # A local repository is read in place, so there is no cache file to
          # check; what matters is that apk parsed our index and counted the
          # packages in it, and that it read DESCRIPTION out of the tarball.
          grep -q "v2 test repository" /tmp/g5_update
          grep -q "distinct packages available" /tmp/g5_update
          grep -q "2 distinct packages" /tmp/g5_update
          echo "G5 groundwork ok: index fetched and parsed"

      # Guard mode has to earn trust before it is used as a verdict.  It moves
      # every mapping up by one page, so if the loader or ld.so depended on
      # tight adjacency this smoke test breaks *here* instead of on the device
      # -- and if a write really does cross a mapping end, the desktop catches
      # it too, with the pc, for the price of twenty spawns.
      - name: Guard pages -- smoke test and desktop A/B
        working-directory: v2
        run: |
          set +e
          echo "--- hello, one empty page after every mapping"
          V2_GUARD=1 ./build/guest-runner --root . tests/guest/hello > /tmp/g_hello 2>&1
          cat /tmp/g_hello
          grep -q "hello from guest" /tmp/g_hello || {
            echo "::error::guard mode broke the minimal guest"; exit 1; }

          echo "--- busybox ls /, guard on"
          V2_GUARD=1 ./build/guest-runner --root tests/guest/root \
            tests/guest/busybox ls / > /tmp/g_ls 2>&1
          cat /tmp/g_ls
          grep -q "etc" /tmp/g_ls || {
            echo "::error::guard mode broke the static busybox"; exit 1; }

          rm -f /tmp/g_guard.*.log
          guard_fail=0
          plain_fail=0
          for run in $(seq 1 20); do
            if ! V2_GUARD=1 ./build/guest-runner --root tests/guest/root \
                 tests/guest/root/sbin/apk --version > /tmp/g_apk.log 2>&1; then
              guard_fail=$((guard_fail + 1))
              cp /tmp/g_apk.log "/tmp/g_guard.$guard_fail.log"
            fi
          done
          for run in $(seq 1 20); do
            if ! ./build/guest-runner --root tests/guest/root \
                 tests/guest/root/sbin/apk --version > /tmp/g_plain.log 2>&1; then
              plain_fail=$((plain_fail + 1))
            fi
          done
          echo "apk --version: guard $guard_fail/20 failed, plain $plain_fail/20 failed"
          if grep -l "GUARD PAGE" /tmp/g_guard.*.log 2>/dev/null; then
            echo "::error::a write crossed the end of a mapping -- the pc in that log is the writer"
            exit 1
          fi
          echo "guard: no mapping was written past its end in $guard_fail failing runs"

      # The gate v1 died on -- two hundred runs, each a fresh process, so the
      # loader runs two hundred times.  This step answers two separate
      # questions:
      #
      #   did anything NEW break?  `Error relocating <lib>: <sym>: symbol not
      #       found` is the known bug (ARCH 14.9).  Any other signature, any
      #       MISMATCH, any FAULT, any missing package count is red.
      #   is the known bug worse?  The rate is printed; above 5% is red.
      #
      # The 5% ceiling is calibrated on THIS step's configuration, which sets
      # V2_VERIFY.  That matters: the same code measures 1.1% with the check
      # on and 5.5% with it off, because the check's extra 4 MB moves every
      # library.  A ceiling derived from one mode and enforced in the other is
      # red by construction -- that is exactly what happened on f085f48
      # (11/200 = 5.5%), and it was a bug in the gate, not a regression.
      #
      # So: this step pins the mode it was calibrated for (verify on: 2.2
      # failures expected per 200, 5% = mean + 5 sigma) and the shipping
      # configuration -- verify off -- is measured by v2-flake.yml nightly.
      # The strict "200 of 200" gate lives there too, expected red until
      # G4-flake closes.
      - name: apk update two hundred times
        working-directory: v2
        env:
          V2_VERIFY: "1"
        run: |
          set -eu
          known=0
          runs=200
          echo "mode: V2_VERIFY=${V2_VERIFY:-unset} (calibrated for this step: 1.1%/run, ceiling 5%)"
          fired=0
          silent=0
          : > /tmp/g5_fail.txt
          : > /tmp/g5_novel.txt
          : > /tmp/g5_evidence.txt
          for run in $(seq 1 $runs); do
            if ! ./build/guest-runner --root /tmp/g5root /tmp/g5root/sbin/apk \
                 update --allow-untrusted --no-progress > /tmp/g5_loop.log 2>&1; then
              line=$(grep -m1 -E "Error relocating|FAULT|MISMATCH" /tmp/g5_loop.log || true)
              echo "run $run: ${line:-exited non-zero, no error line}" >> /tmp/g5_fail.txt
              cp /tmp/g5_loop.log "/tmp/g5_fail.$run.log"
              if grep -q "MISMATCH" /tmp/g5_loop.log \
                 || grep -q "FAULT" /tmp/g5_loop.log \
                 || ! printf '%s' "$line" | grep -q "Error relocating .*: symbol not found"; then
                echo "run $run: ${line:-unclassified failure}" >> /tmp/g5_novel.txt
              else
                known=$((known + 1))
                if grep -q "every readable image page" /tmp/g5_loop.log; then
                  fired=$((fired + 1))
                  grep -E "every readable image page|differs at" /tmp/g5_loop.log \
                    >> /tmp/g5_evidence.txt || true
                else
                  silent=$((silent + 1))
                fi
              fi
            elif ! grep -q "2 distinct packages available" /tmp/g5_loop.log; then
              # Exit 0 with no package count is a second face of the same
              # family: apk finished, so nothing faulted, but a line it prints
              # on the way out is missing -- which a heap-corrupting bug can do
              # just as easily as it can break a symbol lookup.  Seen once in
              # 200 on be979d5, and the log was not kept, which made it
              # undiagnosable; it is kept now, so the next one is evidence.
              echo "run $run: exited zero but printed no package count" >> /tmp/g5_novel.txt
              cp /tmp/g5_loop.log "/tmp/g5_fail.$run.log"
              echo "--- run $run exited zero, full log ---"
              cat /tmp/g5_loop.log
            fi
          done
          echo "runs=$runs known-g4-flake=$known"
          # The comparison that decides where this bug lives: in a failing run,
          # did any read-only page stop matching its file?  If yes, the writer
          # has a target and the offsets say where.  If no, the bytes are right
          # at the moment of failure and the fault is in what ld.so built out
          # of them.
          echo "in-failure comparison: fired=$fired silent=$silent"
          cat /tmp/g5_evidence.txt 2>/dev/null || true
          if [ -s /tmp/g5_fail.txt ]; then
            echo "--- every failure, one line each ---"
            cat /tmp/g5_fail.txt
          fi
          if [ -s /tmp/g5_novel.txt ]; then
            echo "::error::failure that is not the known G4 flake -- this one is new"
            cat /tmp/g5_novel.txt
            first=$(head -1 /tmp/g5_novel.txt | sed 's/^run \([0-9]*\):.*/\1/')
            if [ -f "/tmp/g5_fail.$first.log" ]; then
              cat "/tmp/g5_fail.$first.log"
            fi
            exit 1
          fi
          # 5% is deliberately loose: the measured rate is ~1.1%, and this step
          # is a regression alarm, not the goal metric.
          if [ "$known" -gt 10 ]; then
            echo "::error::G4 flake rate $known/$runs is above the 5% ceiling"
            exit 1
          fi
          if [ "$known" -gt 0 ]; then
            echo "::warning::G4 flake: $known of $runs runs ($((known * 1000 / runs)) per mille), known and tracked (ARCH 14.9)"
          else
            echo "G5 gate: apk update ran $runs times, 0 failures"
          fi

      # The other half of G5: unpack a package.  This is the first time the
      # guest creates files, writes a database and renames temp files over
      # their targets -- mkdirat, renameat, fchmod, utimensat, fsync.
      # G5b -- OPEN.  apk unpacks the package and dies inside libz's
      # inflate_fast with zlib's window pointer NULL, which means something
      # wrote eight zero bytes into apk's inflate state.  Deterministic, and
      # it only happens for a package big enough to need the fast loop.
      # Kept in the build so it cannot be forgotten; not allowed to colour
      # the gate red, because `apk update` -- the actual death line -- is
      # what this job is for.
      - name: apk add from the local repository (known failure, G5b)
        id: add
        continue-on-error: true
        working-directory: v2
        run: |
          set -eu
          ./build/guest-runner --root /tmp/g5root /tmp/g5root/sbin/apk \
            add --allow-untrusted --no-progress zlib \
            2>&1 | tee /tmp/g5_add
          # zlib's real dependency is so:libc.musl-aarch64.so.1, so musl comes
          # with it: one file plus one dependency, both from upstream bytes.
          test -f /tmp/g5root/usr/lib/libz.so.1.4
          test -f /tmp/g5root/lib/apk/db/installed
          grep -q "P:zlib" /tmp/g5root/lib/apk/db/installed
          grep -q "P:musl" /tmp/g5root/lib/apk/db/installed
          echo "--- database ---"
          grep -E "^(P|V):" /tmp/g5root/lib/apk/db/installed
          echo "G5 ok: package installed, dependency resolved, database written"

      - name: Note the open G5b failure
        if: steps.add.outcome == 'failure'
        run: |
          echo "::warning::apk add is still failing (G5b) -- libz inflate reads a NULL window"
